name: Download Minecraft build photos into the repository
on:
  push:
    paths:
      - ".github/workflows/download-build-images.yml"
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download real Minecraft screenshots locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          download() {
            path="$1"; url="$2"
            echo "Downloading $path"
            if ! curl -L --fail --silent --show-error --retry 2 --max-time 40 "$url" -o "$path"; then
              rm -f "$path"
              echo "Primary URL failed for $path"
              return 1
            fi
            size=$(wc -c < "$path")
            if [ "$size" -lt 4000 ]; then
              rm -f "$path"
              echo "File too small for $path"
              return 1
            fi
          }
          download images/build-01.jpg "https://i.imgur.com/wQKmTDS.jpg" || download images/build-01.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2026/032/19576179-photo_xl.webp"
          download images/build-02.jpg "https://i.pinimg.com/originals/f8/d5/c3/f8d5c34f0f44f725491fb80fe5380371.jpg" || download images/build-02.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2025/983/18998670_l.webp"
          download images/build-03.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2026/032/19576179-photo_xl.webp" || download images/build-03.jpg "https://cdn.minecraft-schematics.com/pictures/27511/large-picture-27511.jpg"
          download images/build-04.jpg "https://cdn-ak.f.st-hatena.com/images/fotolife/f/finn0219/20231111/20231111162644.jpg" || download images/build-04.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2026/191/19589477_xl.webp"
          download images/build-05.jpg "https://www.grabcraft.com/files/products/large/large_rustic-medieval-house-1-3926.png" || download images/build-05.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2024/031/18208446_l.webp"
          download images/build-06.jpg "https://i.pinimg.com/736x/3c/d6/d5/3cd6d52183ec83dffa1b519b556dfe85.jpg" || download images/build-06.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2021/557/14188944_xl.jpg"
          download images/build-07.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2023/319/17419784-capture_l.jpg" || download images/build-07.jpg "https://cdn.minecraft.how/images/blog/585/best-minecraft-iron-farm-designs-for-2026-and-beyond-9.webp"
          download images/build-08.jpg "https://fiverr-res.cloudinary.com/images/q_auto%2Cf_auto/gigs3/255873420/original/86deaea6d0459f21bb33f4707f110c9389e45e5a/build-an-iron-farm-in-minecraft.png" || download images/build-08.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2026/521/19569031_xl.webp"
          download images/build-09.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2026/191/19589477_xl.webp" || download images/build-09.jpg "https://cdn-ak.f.st-hatena.com/images/fotolife/f/shinya_09dom/20210303/20210303083240.jpg"
          download images/build-10.jpg "https://static.planetminecraft.com/files/resource_media/screenshot/1215/2012-04-11_201423_1957760_thumb.jpg" || download images/build-10.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2026/521/19569031_xl.webp"
