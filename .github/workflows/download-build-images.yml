name: Download Minecraft catalog images by category
on:
  push:
    paths:
      - ".github/workflows/download-build-images.yml"
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate Minecraft build images
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          mkdir -p images
          download() {
            path="$1"; shift
            for url in "$@"; do
              tmp="$(mktemp)"
              echo "Trying image for $path: $url"
              if curl -L --fail --silent --show-error --retry 1 --max-time 25 "$url" -o "$tmp" && [ "$(wc -c < "$tmp")" -gt 4000 ] && identify "$tmp" >/dev/null 2>&1; then
                if convert "$tmp[0]" -strip -resize '1400x1000>' -quality 88 "$path"; then
                  rm -f "$tmp"
                  echo "Saved $path"
                  return 0
                fi
              fi
              rm -f "$tmp"
            done
            echo "No valid Minecraft image found for $path"
            return 1
          }
