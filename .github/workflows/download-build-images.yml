name: Sync matching Minecraft project images
on:
  push:
    paths:
      - ".github/workflows/download-build-images.yml"
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download each project's own preview image
        env:
          PROJECT_URLS: '["https://www.planetminecraft.com/project/simple-dwelling-medieval-farm-house/","https://www.planetminecraft.com/project/automatic-food-farm-v2-1-20/","https://www.planetminecraft.com/project/automatic-crop-farm-seamlessly-underground/","https://www.planetminecraft.com/project/automatic-wool-farm-barn-schematic-world-download/","https://www.planetminecraft.com/project/a-hose-download-litematic/","https://www.planetminecraft.com/project/castle-and-medieval-farms-download/","https://www.planetminecraft.com/project/automatic-villagers-farm-1-19/","https://www.planetminecraft.com/project/auto-crop-farm-schematic/","https://www.planetminecraft.com/project/iron-farm-6159885/","https://www.planetminecraft.com/project/iron-farm-easy-schem-litematica/","https://www.planetminecraft.com/project/iron-farm-1-20/","https://www.planetminecraft.com/project/highly-efficient-creeper-farm-litematic/","https://www.planetminecraft.com/project/easy-creeper-farm/","https://www.planetminecraft.com/project/automatic-bonemeal-farm-1-19/","https://www.planetminecraft.com/project/vertical-automatic-mob-farm-download/","https://www.planetminecraft.com/project/white-modern-house-litematic-with-interior/","https://www.planetminecraft.com/project/casa-moderna-modern-house-6887115/","https://www.planetminecraft.com/project/modern-house-177-map-litematic/","https://www.planetminecraft.com/project/modern-house-170-map-litematic/","https://www.planetminecraft.com/project/modern-house-167-map-litematic/","https://www.planetminecraft.com/project/modern-house-169-map-litematic/","https://www.planetminecraft.com/project/5x5-core-starter-house-litematic/","https://www.planetminecraft.com/project/medieval-survival-house-fully-decorated-interior-black-edition-schematic-world-litematic/","https://www.planetminecraft.com/project/medieval-village-house-6938005/","https://www.planetminecraft.com/project/modern-house-download-7055883/","https://www.planetminecraft.com/project/ultra-iron-farm-auto-crafter-amp-storage-system-schem-world/","https://www.planetminecraft.com/project/iron-farm-2845224/","https://www.planetminecraft.com/project/base-castle/"]'
        run: |
          python3 - <<'PY'
          import json, os, re, time
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from pathlib import Path

          urls = json.loads(os.environ["PROJECT_URLS"])
          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.image = None
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "meta":
                      return
                  a = {k.lower(): v for k, v in attrs}
                  prop = (a.get("property") or a.get("name") or "").lower()
                  if prop in ("og:image", "twitter:image") and a.get("content") and not self.image:
                      self.image = a["content"]

          Path("images").mkdir(exist_ok=True)
          for i, page_url in enumerate(urls, 1):
              req = Request(page_url, headers={"User-Agent": "Mozilla/5.0 (compatible; CraftBaseImageSync/1.0)"})
              with urlopen(req, timeout=35) as response:
                  page = response.read().decode("utf-8", errors="replace")
              parser = MetaParser()
              parser.feed(page)
              image_url = parser.image
              if not image_url or not image_url.startswith(("https://", "http://")):
                  raise RuntimeError(f"No project preview image found for {page_url}")
              req = Request(image_url, headers={"User-Agent": "Mozilla/5.0"})
              with urlopen(req, timeout=35) as response:
                  data = response.read()
                  content_type = response.headers.get("Content-Type", "")
              if len(data) < 4000 or not content_type.startswith("image/"):
                  raise RuntimeError(f"Invalid image for card {i}: {image_url} ({content_type}, {len(data)} bytes)")
              path = Path(f"images/build-{i:02d}.jpg")
              # Save the exact project preview bytes; browsers identify the actual image format.
              path.write_bytes(data)
              print(f"Saved {path} from {page_url} -> {image_url} ({len(data)} bytes)")
              time.sleep(1)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/build-*.jpg
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Match catalog photos to their Minecraft projects [skip image sync]"
            git pull --rebase origin "$(git branch --show-current)"
            git push
          fi
