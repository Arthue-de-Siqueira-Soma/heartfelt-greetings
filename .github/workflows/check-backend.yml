name: Check CraftBase backend

on:
  push:
    paths:
      - "api/**"
      - "tests/**"
      - "scripts/**"
      - "construcoes-gratis.html"
      - "index.html"
      - "catalogo.html"
      - "criar-construcao.html"
      - "docs/**"
      - "BACKEND_SETUP.md"
      - ".github/workflows/check-backend.yml"
  pull_request:
    paths:
      - "api/**"
      - "tests/**"
      - "scripts/**"
      - "construcoes-gratis.html"
      - "index.html"
      - "catalogo.html"
      - "criar-construcao.html"
      - ".github/workflows/check-backend.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check free browser builder syntax
        run: node scripts/check-browser-builder.js
      - name: Check API JavaScript syntax
        run: |
          node --check api/health.js
          node --check api/analyze.js
          node --check api/generate.js
          node --check api/create.js
      - name: Run generator and AI-plan tests
        run: |
          node --test tests/generate.test.js
          node --test tests/create.test.js
      - name: Generate demo schematic
        run: node scripts/create-demo-schematic.js
      - name: Upload demo schematic
        uses: actions/upload-artifact@v4
        with:
          name: craftbase-demo-litematic
          path: craftbase-demo.litematic
          if-no-files-found: error
