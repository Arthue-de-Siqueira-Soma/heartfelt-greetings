          download images/build-20.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2022/349/16278005-screenshot-at-min_l.jpg" || download images/build-20.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2025/458/19320516_xl.webp"
          download images/build-21.jpg "https://static.planetminecraft.com/files/resource_media/screenshot/1335/javaw-2013-08-27-19-17-48-94_6272388_thumb.jpg" || download images/build-21.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2024/031/18208446_l.webp"
