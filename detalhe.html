<!DOCTYPE html>

<title>Detalhes da construção — CraftBase</title>
<meta name="description" content="Veja detalhes, imagens e informações de construções para Minecraft no CraftBase.">

<style>
:root{--bg:#0b100d;--panel:#131b15;--panel2:#1a251c;--line:#2a3a2d;--green:#9bea68;--mint:#c6ff9f;--muted:#a0afa1;--text:#f3f7ef}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#29462b 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}
header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 max(4vw,calc((100vw - 1180px)/2));border-bottom:1px solid #ffffff12;background:#0b100df2;position:sticky;top:0;z-index:5;backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.7px}.logo{width:39px;height:39px;display:grid;place-items:center;background:var(--green);color:#14210f;font-size:22px;box-shadow:inset -5px -5px #4e9c37;border:2px solid #c7ffa9}.brand span{color:var(--green)}
nav{display:flex;gap:24px;font-size:12px;color:var(--muted);font-weight:700}nav a:hover{color:var(--green)}.pill{font-size:10px;border:1px solid #416442;border-radius:99px;padding:9px 11px;color:var(--mint)}
.wrap{width:min(1100px,92%);margin:auto}.back{display:inline-block;color:var(--muted);font-size:12px;font-weight:700;margin:30px 0 22px}.back:hover{color:var(--green)}
.detail{display:grid;grid-template-columns:1.08fr .92fr;gap:32px;align-items:start;padding-bottom:70px}.image-wrap{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel);position:sticky;top:100px}.image-wrap img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.info{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#18231b,#111813);padding:clamp(20px,4vw,34px)}.tag{display:inline-block;color:var(--mint);border:1px solid #416442;border-radius:99px;padding:7px 10px;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.info h1{font-size:clamp(30px,4vw,48px);letter-spacing:-2px;line-height:1.05;margin:17px 0 12px}.desc{color:var(--muted);font-size:14px;line-height:1.9}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:23px 0}.fact{padding:13px;border:1px solid var(--line);border-radius:8px;background:#ffffff04}.fact small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:7px}.fact strong{font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:12px 15px;font-size:11px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#11200e;border-color:var(--green)}.secondary{background:#ffffff05}.note{border:1px solid #5a4b2c;background:#211d13;color:#e6d5a7;padding:15px 17px;border-radius:9px;font-size:11px;line-height:1.8;margin-top:18px}.not-found{padding:60px 0;text-align:center}.footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:10px}.footer-inner{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
@media(max-width:760px){nav{display:none}.detail{grid-template-columns:1fr;gap:16px}.image-wrap{position:static}.info h1{letter-spacing:-1px}.pill{font-size:9px}}

/* CRAFTBASE NIGHT SKY — lunar edition */
:root{--bg:#070817;--panel:#111326;--panel2:#191b35;--line:#303052;--green:#c5c3ff;--mint:#e1dfff;--muted:#aaaac9;--text:#f5f4ff}
html,body{background:#070817}
body{background:radial-gradient(ellipse at 75% -10%,#29234d 0,transparent 36%),radial-gradient(ellipse at 12% 55%,#121e42 0,transparent 42%),#070817}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.62;background-image:radial-gradient(1px 1px at 7% 18%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 17% 71%,#c9d7ff 99%,transparent),radial-gradient(1px 1px at 29% 33%,#fff 99%,transparent),radial-gradient(2px 2px at 39% 12%,#d8d2ff 99%,transparent),radial-gradient(1px 1px at 48% 83%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 58% 25%,#fff 99%,transparent),radial-gradient(1px 1px at 69% 63%,#c9d7ff 99%,transparent),radial-gradient(2px 2px at 78% 16%,#fff 99%,transparent),radial-gradient(1px 1px at 88% 48%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 95% 78%,#d8d2ff 99%,transparent);animation:starDrift 20s ease-in-out infinite alternate}
header{background:#080817f2;border-bottom-color:#c6c5ff20}
.logo{background:#c5c3ff;color:#101126;box-shadow:0 0 22px #9e9cff2a;border-color:#e1dfff}
nav a:hover,.brand span{color:#c5c3ff}
.pill{border-color:#aaa7ff55;color:#e1dfff}
.detail-card,.info-card,.note,.panel{background:linear-gradient(145deg,#17182f,#0e1022);border-color:#323253}
.btn.primary{background:linear-gradient(135deg,#e1e0ff,#aaa8ff);color:#15152d}
@keyframes starDrift{from{transform:translate3d(0,0,0);opacity:.4}to{transform:translate3d(0,-8px,0);opacity:.72}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}


/* CRAFTBASE — eclipse / deep violet theme */
:root{
  --bg:#05040b;--panel:#0c0917;--panel2:#151027;--line:#302044;
  --green:#b7a0ff;--mint:#e4d9ff;--muted:#aaa0bf;--text:#f7f2ff;
  --orange:#c4a4ff;
}
html,body{background:#05040b!important;color:#f7f2ff}
body{
  background:
    radial-gradient(ellipse at 76% 0%,#24113f 0,transparent 34%),
    radial-gradient(ellipse at 8% 52%,#110d28 0,transparent 40%),
    #05040b!important;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.52;
  background-image:
    radial-gradient(1px 1px at 7% 18%,#fff 99%,transparent),
    radial-gradient(1.5px 1.5px at 17% 71%,#d8c8ff 99%,transparent),
    radial-gradient(1px 1px at 29% 33%,#fff 99%,transparent),
    radial-gradient(2px 2px at 39% 12%,#c9a8ff 99%,transparent),
    radial-gradient(1px 1px at 48% 83%,#fff 99%,transparent),
    radial-gradient(1.5px 1.5px at 58% 25%,#fff 99%,transparent),

    radial-gradient(1px 1px at 88% 48%,#fff 99%,transparent),
    radial-gradient(1.5px 1.5px at 95% 78%,#c9a8ff 99%,transparent);

}
body>*{position:relative;z-index:1}
header{background:rgba(6,4,14,.92)!important;border-color:#b99aff24!important;backdrop-filter:blur(18px)}
.logo{background:linear-gradient(135deg,#e4d9ff,#9872e8)!important;color:#10091f!important;border-color:#e0d0ff!important;box-shadow:0 0 24px #8d5ce82a!important}
.brand span,nav a:hover,.back:hover{color:#c6adff!important}
.pill,.tag{border-color:#7654a566!important;color:#e0d4ff!important;background:#a57aff0d}
.btn.primary,.primary{background:linear-gradient(135deg,#e7dcff,#a88aff)!important;border-color:#c1a6ff!important;color:#140d25!important;box-shadow:0 8px 28px #8e5be51c}
.btn.primary:hover,.primary:hover{background:linear-gradient(135deg,#f2eaff,#c0a8ff)!important;box-shadow:0 10px 34px #8e5be540}
.btn.secondary,.secondary{background:#ffffff07!important;border-color:#a58acb55!important;color:#f3edff}
.btn.secondary:hover,.secondary:hover{border-color:#c3aaff!important;color:#d8c4ff!important}
.hero{background-image:linear-gradient(90deg,rgba(4,3,11,.88) 0%,rgba(8,4,19,.68) 48%,rgba(8,4,19,.28) 100%),linear-gradient(0deg,#05040b 0%,transparent 42%),url('./images/hero.jpg')!important}
.hero:after{background:linear-gradient(180deg,rgba(4,2,12,.25),transparent 34%,rgba(4,2,12,.22))!important}
.hero h1 span,.highlights span:before,.stat strong,.eyebrow{color:#c9b3ff!important}
.eyebrow:before{background:#c9b3ff!important}
.stats .stat,.stat{background:linear-gradient(145deg,#100b1c,#0a0813)!important;border-color:#302044!important}
.build-card,.info,.info-card,.detail-card,.step,.fact,.panel{
  background:linear-gradient(145deg,#130d20,#0a0812)!important;border-color:#302044!important;
}
.build-card:hover{border-color:#8c68c7!important}
.type{background:#090612eF!important;color:#e0d4ff!important;border-color:#a58acb33!important}
.filter,.search{background:#0e0a19!important;border-color:#302044!important;color:#ddd2f0!important}
.filter.active,.filter:hover{background:#c7b0ff!important;border-color:#c7b0ff!important;color:#130c24!important}
.meta span{border-color:#302044!important;color:#d4c7e9!important}
.note{background:#140e20!important;border-color:#55406f!important;color:#d8c8f1!important}
.footer{border-color:#302044!important}
@keyframes cbStars{from{transform:translateY(0);opacity:.35}to{transform:translateY(-7px);opacity:.68}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}

</style>
