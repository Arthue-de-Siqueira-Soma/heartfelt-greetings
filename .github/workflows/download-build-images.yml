          download images/build-24.jpg "https://ccdn.g-portal.com/large_Gallery_MC_Blog_Iron_Farm_0004_5_47d3ad1fe5.jpg" || download images/build-24.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2021/557/14188944_xl.jpg"
          download images/build-25.jpg "https://cdn.minecraft.how/images/blog/585/best-minecraft-iron-farm-designs-for-2026-and-beyond-9.webp" || download images/build-25.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2026/521/19569031_xl.webp"
          download images/build-26.jpg "https://cdn-ak.f.st-hatena.com/images/fotolife/s/shinya_09dom/20210303/20210303083240.jpg" || download images/build-26.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2026/191/19589477_xl.webp"
          download images/build-27.jpg "https://i.pinimg.com/originals/63/46/75/634675bdbac9e89f4ed9d0d33b5d2ecf.png" || download images/build-27.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2026/521/19569031_xl.webp"
          download images/build-28.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2026/521/19569031_xl.webp" || download images/build-28.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2021/557/14188944_xl.jpg"
          download images/hero.jpg "https://static.planetminecraft.com/files/image/minecraft/project/2021/735/14425238_l.jpg" || download images/hero.jpg "https://i.imgur.com/wQKmTDS.jpg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.jpg
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Add real Minecraft construction photos [skip image sync]"
            git push
          fi
